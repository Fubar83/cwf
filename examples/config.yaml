# wag config: a complete example for Linux, macOS or WSL.
# Copy to ~/.config/wag/config.yaml (or point WAG_CONFIG at it), and examples/git-view.sh and
# examples/jira-notes.sh to ~/.config/wag/.
# Everything lives here in your home folder; wag never needs files in the repos themselves.
# See docs/configuration.md for every option, and docs/tmux.md for the tmux layouts
# (examples/tmux-per-repo.yaml and examples/tmux-switch.yaml have other ones).

# Main checkouts live here, and each feature gets a folder here too:
#   ~/projects/repo1                 main checkout
#   ~/projects/feature-a/repo1       worktree on branch feature-a
projects: ~/projects
# features: _features    # uncomment to collect feature folders in ~/projects/_features instead

# Hooks come at two levels, each with create and remove. Each step is a bash command line; a step whose first
# word is a file next to this config (setup.sh, say) is run as a script.
#   repo:     once per repo of the feature, in its worktree. These steps run first, then the repo's own below.
#   feature:  once for the whole feature, in the feature folder: on create when the feature is created (after
#             every worktree is there), on remove before its last worktree goes.
# create: if a step fails, the whole create is rolled back. remove: if a step fails, nothing is removed
# (unless --force).
hooks:
  repo:
    create:
      - cp "$WAG_MAIN/.env" .env 2>/dev/null || true   # the main checkout's local .env, if it has one
  feature:
    create:
      # NOTES.md beside the worktrees when the branch ends in a Jira key, like feature/vfs-1234.
      # Copy examples/jira-notes.sh to ~/.config/wag/jira-notes.sh for this one.
      - jira-notes.sh https://yourcompany.atlassian.net
    remove:
      - rm -f NOTES.md

repos:
  repo1:
    create:
      - cp ~/secrets/repo1/appsettings.Local.json src/Api/appsettings.Local.json
      - npm ci
  repo2:
    path: ~/work/repo2      # a main checkout outside the projects folder
    remove:
      - docker compose down

# Start profiles run once per call for the whole feature.
# Pick profiles per call with +name, e.g. `wag feature-a repo1 repo2 +tmux`.
start:
  # A tmux session named after the branch, with two panes side by side, both in the feature folder (needs tmux 3.2+):
  #
  #   left half:  your AI agent ("agent"), working on every repo of the feature
  #   right half: the git pane ("git_ui"), a live, read-only view of every repo of the feature:
  #               for each worktree its branch and whether it is pushed, staged (green) and not-staged (red) files
  #               with line counts, new files (??), commits on origin's default branch not merged yet, and the
  #               latest commits. It redraws in place only when something changes, so it stays still while the
  #               agent works, and it never takes git's index lock, so it cannot get in the agent's way.
  #               Set git_ui to lazygit or tig for an interactive tool instead.
  #
  # Calling wag again, or adding a repo, attaches to the session; a new repo shows up in the git pane by itself.
  tmux:
    - |
      agent="copilot"                              # your agent: copilot, claude, codex, gemini, aider, ...
      git_ui="sh $HOME/.config/wag/git-view.sh"   # the git pane: this live view, or lazygit, or tig
      # tmux turns "." and ":" in session names into "_", so do the same to find the session again.
      s=$(printf '%s' "$WAG_BRANCH" | tr '.:' '__')
      if ! tmux has-session -t "=$s" 2>/dev/null; then
        tmux new-session -d -s "$s" -c "$WAG_FEATURE_DIR" \
          -e WAG_FEATURE="$WAG_FEATURE" -e WAG_BRANCH="$WAG_BRANCH" -e WAG_FEATURE_DIR="$WAG_FEATURE_DIR" "$agent"
        tmux split-window -h -l 50% -t "=$s:" -c "$WAG_FEATURE_DIR" "$git_ui"
        tmux select-pane -t "=$s:.0"
      fi
      if [ -n "$TMUX" ]; then tmux switch-client -t "=$s"
      elif [ -t 0 ]; then tmux attach -t "=$s"
      else echo "tmux session $s is ready: tmux attach -t $s" >&2
      fi

# Start profiles to run when no +name is given. `--no-start` skips them for one call.
autostart: [tmux]
