# wag config: a complete example for Linux, macOS or WSL.
# Copy to ~/.config/wag/config.yaml (or point WAG_CONFIG at it).
# Everything lives here in your home folder; wag never needs files in the repos themselves.
# See docs/configuration.md for every option, and docs/tmux.md for the tmux setup.

# Main checkouts live here, and each feature gets a folder here too:
#   ~/projects/repo1                       main checkout
#   ~/projects/feature-a/repo1-feature-a   worktree on branch feature-a
projects: ~/projects

# Hooks for every repo. Global steps run first, then the repo's own.
# create: after a worktree is made. If a step fails, the whole create is rolled back.
# remove: before a worktree is removed. If a step fails, nothing is removed (unless --force).
hooks:
  create:
    - copy: .env            # the main checkout's local .env, if it has one
      optional: true
  remove:
    # Close this worktree's lazygit pane in the feature's tmux session (see start.tmux below).
    # Never closes the pane you are running wag from, and does nothing when tmux is not running.
    - run: |
        command -v tmux >/dev/null 2>&1 || exit 0
        tmux has-session -t "=$WAG_FEATURE" 2>/dev/null || exit 0
        tmux list-panes -s -t "=$WAG_FEATURE" -F '#{pane_id} #{@wag_wt}' | while read -r id wt; do
          [ "$wt" = "$WAG_WORKTREE" ] && [ "$id" != "$TMUX_PANE" ] && tmux kill-pane -t "$id"
        done
        tmux select-layout -t "=$WAG_FEATURE:" main-vertical 2>/dev/null
        exit 0

repos:
  repo1:
    create:
      - copy: ~/secrets/repo1/appsettings.Local.json
        to: src/Api/appsettings.Local.json
      - run: npm ci
  repo2:
    path: ~/work/repo2      # a main checkout outside the projects folder
    remove:
      - run: docker compose down

# Start profiles run once per call for the whole feature, in the printed path:
# the worktree for one repo, the feature folder for several.
# Pick profiles per call with +name, e.g. `wag feature-a repo1 repo2 +tmux`.
start:
  # One tmux session per feature: Copilot on the left half, working on all repos from the feature folder;
  # one lazygit per repo stacked on the right half. Calling again attaches; a newly added repo gets its own lazygit.
  # Needs tmux 3.2 or later.
  tmux:
    - run: |
        s="$WAG_FEATURE"
        t="=$s:"
        if ! tmux has-session -t "=$s" 2>/dev/null; then
          tmux new-session -d -s "$s" -c "$WAG_FEATURE_DIR" \
            -e WAG_FEATURE="$s" -e WAG_FEATURE_DIR="$WAG_FEATURE_DIR" copilot
        fi
        have=$(tmux list-panes -t "$t" -F '#{@wag_wt}')
        printf '%s\n' "$WAG_WORKTREES" | while IFS= read -r wt; do
          [ -n "$wt" ] || continue
          printf '%s\n' "$have" | grep -Fqx "$wt" && continue
          pane=$(tmux split-window -t "$t" -c "$wt" -P -F '#{pane_id}' lazygit)
          tmux set-option -p -t "$pane" @wag_wt "$wt"
        done
        tmux set-window-option -t "$t" main-pane-width 50%
        tmux select-layout -t "$t" main-vertical
        tmux select-pane -t "$t.0"
        if [ -n "$TMUX" ]; then tmux switch-client -t "=$s"
        elif [ -t 0 ]; then tmux attach -t "=$s"
        else echo "tmux session $s is ready: tmux attach -t $s" >&2
        fi

# Start profiles to run when no +name is given. `--no-start` skips them for one call.
autostart: [tmux]
