# Copy to ~/.config/cwf/config.yaml (or point CWF_CONFIG at the file).

projectsDir: ~/projects

jira:
  site: acme.atlassian.net
  projects:
    - key: VFS
      repos: [vfs-api, vfs-infra]

github:
  org: acme

models:
  main: gpt-6.1-sol
  researcher: gpt-6-luna
  # USD per million tokens, for the live estimate of AI credits.
  prices:
    gpt-6.1-sol: { input: 2, output: 10 }
    gpt-6-luna: { input: 0.5, output: 2 }   # VERIFY against the current price list

limits:
  aicPerRun: 1000        # soft cap per run, cwf asks before raising it
  buildRounds: 4         # build rounds before the issue is blocked
  idleTimeoutMin: 10     # silence before a session counts as hung
  waitForUserMin: 20     # how long a question may stay unanswered before cwf pauses

publish:
  default: draft         # draft | ready (the default choice when publishing)
  reviewersOnReady: []   # e.g. [acme/vfs-team]

clean:
  staleDays: 14

# Rules per repo. A repo without its own rules uses the defaults.
# Gate steps run in order and stop at the first failure. cwf never changes code itself:
# `fix` is only sent to Copilot as a suggestion. gitleaks always runs last, if it is installed.
repos:
  defaults:
    setup: []
    gate: []
  vfs-api:
    setup:
      - dotnet restore
    gate:
      - name: format
        run: dotnet format --verify-no-changes
        fix: dotnet format
      - name: test
        run: dotnet test --no-restore
  vfs-infra:
    setup:
      - npm ci
    gate:
      - name: build
        run: npm run build
      - name: test
        run: npm test
