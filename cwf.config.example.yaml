# Kopiera till ~/.config/cwf/config.yaml (eller ange sökvägen i CWF_CONFIG).

projectsDir: ~/projects

jira:
  site: acme.atlassian.net
  projects:
    - key: VFS
      repos: [vfs-api, vfs-infra]

github:
  org: acme

models:
  main: gpt-6.1-sol
  researcher: gpt-6-luna
  # USD per miljon tokens, för live-uppskattning av AI-krediter.
  prices:
    gpt-6.1-sol: { input: 2, output: 10 }
    gpt-6-luna: { input: 0.5, output: 2 }   # VERIFIERA mot aktuell prislista

limits:
  aicPerRun: 1000        # mjukt tak per körning, cwf frågar om höjning
  buildRounds: 4         # Bygga-varv innan ärendet blockeras
  idleTimeoutMin: 10     # tystnad innan en session räknas som hängd
  waitForUserMin: 20     # hur länge en fråga får stå obesvarad innan cwf pausar

publish:
  default: draft         # draft | ready (förvalt alternativ vid publicering)
  reviewersOnReady: []   # t.ex. [acme/vfs-team]

clean:
  staleDays: 14

# Regler per repo. Ett repo utan egna regler använder defaults.
# gate körs i ordning och stannar vid första fel. cwf ändrar aldrig kod:
# `fix` skickas till Copilot som förslag. gitleaks körs alltid sist om det finns.
repos:
  defaults:
    setup: []
    gate: []
  vfs-api:
    setup:
      - dotnet restore
    gate:
      - name: format
        run: dotnet format --verify-no-changes
        fix: dotnet format
      - name: test
        run: dotnet test --no-restore
  vfs-infra:
    setup:
      - npm ci
    gate:
      - name: bygg
        run: npm run build
      - name: test
        run: npm test
      - name: cdk synth
        run: npx cdk synth --quiet
        when: cdk.json
