name: CI

on:
  pull_request:
  push:
    branches: [master]

# A superseded run on the same PR is of no interest; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && git --version
      - run: npm install
      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Install the tarball npm would publish, so a file missing from
      # "files" fails here rather than for whoever installs the release.
      # The tarball name follows the package name, so ask npm for it.
      - run: npm install --global "$(npm pack --silent)"
      - run: wag --version
      - run: wag --help
